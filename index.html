<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R + R 💗</title>

<!-- Librería de partículas (corazones flotantes) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/2.12.0/tsparticles.bundle.min.js"></script>

<!-- Estilos -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="tsparticles"></div>

<div class="stage">
  <!-- PORTADA -->
  <div class="heart-cover" id="cover">
    <div class="heart" id="heartBtn">
      <svg viewBox="0 0 32 29.6"><path fill="url(#g)" d="M16,29.6l-2.3-2.1C5.4,20.1,0,15.2,0,9.1C0,4.2,3.8,0.4,8.6,0.4c2.7,0,5.3,1.3,7.4,3.4c2.1-2.1,4.7-3.4,7.4-3.4C28.2,0.4,32,4.2,32,9.1c0,6.1-5.4,11-13.7,18.4L16,29.6z"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7b7c8"/><stop offset=".6" stop-color="#e98aa8"/><stop offset="1" stop-color="#d76f94"/></linearGradient></defs></svg>
      <div class="shine"></div>
      <div class="initials">R+R</div>
    </div>
    <div class="cover-hint">✧ toca el corazón ✧</div>
  </div>

  <!-- SOBRE -->
  <div class="envelope-wrap" id="envWrap">
    <div class="envelope" id="envelope">
      <div class="env-body"></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="env-seal">R</div>
    </div>
    <div class="env-hint">toca el sobre para abrir 💌</div>
  </div>

  <button class="back-btn" id="backBtn">← volver</button>
</div>

<!-- CARTA -->
<div class="letter-overlay" id="letterOverlay">
  <div class="letter">
    <button class="letter-close" id="letterClose">✕</button>
    <h2>Para ti 💌</h2>
    <p id="letterText"></p>
  </div>
</div>

<!-- REPRODUCTOR -->
<div class="player">
  <div class="track-info">
    <div class="track-art">🎵</div>
    <div class="track-meta">
      <div class="t" id="trackTitle">Nuestra canción</div>
      <div class="a" id="trackArtist">—</div>
    </div>
  </div>
  <div class="controls">
    <button id="prevBtn" title="Anterior">⏮</button>
    <button class="play" id="playBtn" title="Play/Pausa">▶</button>
    <button id="nextBtn" title="Siguiente">⏭</button>
  </div>
  <div class="progress-wrap">
    <span class="time" id="curTime">0:00</span>
    <input type="range" class="bar" id="seek" value="0" min="0" max="100">
    <span class="time" id="durTime">0:00</span>
  </div>
  <div class="vol-wrap"><span>🔊</span><input type="range" class="vol" id="vol" min="0" max="100" value="80"></div>
  <button class="playlist-btn" id="listBtn" title="Lista">☰</button>
</div>
<div class="playlist" id="playlist"><h4>Lista de canciones</h4><ul id="plItems"></ul></div>
<audio id="audio"></audio>

<!-- Scripts (el orden importa) -->
<script src="js/particles.js"></script>
<script src="js/letter.js"></script>
<script src="js/player.js"></script>
</body>
</html>
